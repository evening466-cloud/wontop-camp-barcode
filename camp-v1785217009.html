<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>원탑캠핑장 바코드 가격조회</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --forest-900:#1B3328;
    --forest-700:#2C4A3B;
    --forest-600:#365A48;
    --cream-50:#FAF7EF;
    --wood-200:#EAE0CB;
    --wood-300:#DDCEAF;
    --ember-500:#E2843F;
    --ember-600:#C96C2C;
    --ink-900:#241F1A;
    --ink-600:#5B5347;
    --moss-400:#7E9A79;
    --red-500:#BE4530;
    --shadow: 0 8px 24px rgba(27,51,40,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream-50);
    color:var(--ink-900);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--cream-50);
    display:flex;
    flex-direction:column;
  }

  header{
    background:var(--forest-900);
    color:var(--cream-50);
    padding:calc(env(safe-area-inset-top) + 18px) 20px 16px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:14px;}
  .brand .mark{font-size:20px;}
  .brand h1{font-size:16px; font-weight:800; letter-spacing:0.3px; margin:0;}
  .brand .sub{
    font-size:11px; color:var(--moss-400); font-weight:600;
    letter-spacing:0.5px; text-transform:uppercase;
  }
  .tabs{display:flex; background:rgba(255,255,255,0.08); border-radius:12px; padding:4px; gap:4px;}
  .tab-btn{
    flex:1; border:none; background:transparent; color:rgba(250,247,239,0.65);
    font-size:14px; font-weight:700; padding:10px 0; border-radius:9px; cursor:pointer;
    transition:all .15s ease;
  }
  .tab-btn.active{background:var(--ember-500); color:#1B3328;}

  main{flex:1; padding:18px 16px 40px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- SCAN VIEW ---- */
  .scan-frame{
    position:relative; border-radius:20px; overflow:hidden;
    background:var(--forest-900); aspect-ratio:1/1; box-shadow:var(--shadow); margin-bottom:18px;
  }
  #reader{width:100%; height:100%;}
  #reader video{object-fit:cover;}
  .scan-frame .corners{position:absolute; top:32%; bottom:32%; left:10%; right:10%; pointer-events:none;}
  .scan-frame .corners span{position:absolute; width:26px; height:26px; border:3px solid var(--ember-500);}
  .corners span:nth-child(1){top:0;left:0;border-right:none;border-bottom:none;border-radius:6px 0 0 0;}
  .corners span:nth-child(2){top:0;right:0;border-left:none;border-bottom:none;border-radius:0 6px 0 0;}
  .corners span:nth-child(3){bottom:0;left:0;border-right:none;border-top:none;border-radius:0 0 0 6px;}
  .corners span:nth-child(4){bottom:0;right:0;border-left:none;border-top:none;border-radius:0 0 6px 0;}
  .scan-status{
    position:absolute; bottom:0; left:0; right:0; padding:10px; text-align:center;
    color:rgba(250,247,239,0.85); font-size:12px; font-weight:600;
    background:linear-gradient(transparent, rgba(0,0,0,0.35));
  }
  .cam-off{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100%; color:var(--wood-300); padding:24px; text-align:center; gap:10px;
  }
  .cam-off button{
    margin-top:6px; background:var(--ember-500); border:none; color:var(--forest-900);
    font-weight:800; padding:10px 18px; border-radius:10px; font-size:13px;
  }

  .result-card{
    border-radius:20px; background:var(--forest-900); color:var(--cream-50);
    padding:26px 22px; box-shadow:var(--shadow); position:relative; overflow:hidden;
    min-height:150px; display:flex; flex-direction:column; justify-content:center;
  }
  .result-card::before{
    content:""; position:absolute; top:-1px; left:0; right:0; height:14px;
    background-image: radial-gradient(circle, var(--cream-50) 5.5px, transparent 5.6px);
    background-size:18px 18px; background-position: 0 -9px;
  }
  .result-empty{text-align:center; color:rgba(250,247,239,0.45); font-size:13px; font-weight:600; letter-spacing:0.3px;}
  .result-name{font-size:14px; font-weight:700; color:var(--moss-400); letter-spacing:0.2px; margin-bottom:6px;}
  .result-price{
    font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    font-size:42px; font-weight:800; letter-spacing:-1px; font-variant-numeric:tabular-nums;
  }
  .result-price .won{font-size:20px; margin-left:4px; font-weight:700; color:var(--ember-500);}
  .result-meta{margin-top:10px; font-size:11px; color:rgba(250,247,239,0.5); font-family:monospace; letter-spacing:0.5px;}
  .result-notfound{color:var(--ember-500); font-size:15px; font-weight:700;}

  .capture-btn{
    display:block; width:100%; margin-top:12px; background:var(--ember-500); color:var(--forest-900);
    border:none; border-radius:14px; padding:14px; font-weight:800; font-size:15px;
  }
  .capture-btn:active{background:var(--ember-600);}
  .capture-btn.loading{opacity:0.6; pointer-events:none;}
  .mini-capture-btn{
    display:none; width:100%; margin-bottom:10px; background:var(--ember-500); color:var(--forest-900);
    border:none; border-radius:12px; padding:12px; font-weight:800; font-size:14px;
  }
  .mini-capture-btn.active{display:block;}
  .manual-row{display:flex; gap:8px; margin-top:14px;}
  .manual-row input{
    flex:1; border:1.5px solid var(--wood-300); background:#fff; border-radius:12px;
    padding:12px 14px; font-size:14px; font-family:monospace; color:var(--ink-900);
  }
  .manual-row input:focus{outline:none; border-color:var(--ember-500);}
  .manual-row button{
    background:var(--forest-700); color:#fff; border:none; border-radius:12px;
    padding:0 18px; font-weight:700; font-size:13px;
  }

  /* ---- MANAGE VIEW ---- */
  .search-add{display:flex; gap:8px; margin-bottom:14px;}
  .search-add input{
    flex:1; border:1.5px solid var(--wood-300); background:#fff; border-radius:12px;
    padding:11px 14px; font-size:14px;
  }
  .search-add input:focus{outline:none;border-color:var(--ember-500);}
  .add-btn{
    background:var(--ember-500); color:var(--forest-900); border:none; border-radius:12px;
    padding:0 16px; font-weight:800; font-size:20px; line-height:1;
  }
  .empty-state{text-align:center; padding:60px 20px; color:var(--ink-600);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}
  .empty-state p{font-size:13px; line-height:1.6;}
  .item-count{font-size:12px; color:var(--ink-600); font-weight:600; margin-bottom:8px; padding-left:2px;}
  .item-row{
    background:#fff; border:1px solid var(--wood-300); border-radius:14px;
    padding:13px 14px; margin-bottom:9px; display:flex; align-items:center; gap:12px;
  }
  .item-row .info{flex:1; min-width:0;}
  .item-row .name{
    font-size:14.5px; font-weight:700; color:var(--ink-900);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .item-row .barcode{font-family:monospace; font-size:11px; color:var(--ink-600); margin-top:2px; letter-spacing:0.5px;}
  .item-row .cat{
    display:inline-block; background:var(--wood-200); color:var(--forest-700);
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; margin-top:4px;
  }
  .item-row .price{font-family:monospace; font-weight:800; font-size:16px; color:var(--forest-700); white-space:nowrap;}
  .item-row .edit-btn{
    background:var(--wood-200); border:none; border-radius:9px; width:34px; height:34px;
    font-size:15px; color:var(--forest-700); flex-shrink:0;
  }

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(27,51,40,0.55);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-backdrop.active{display:flex;}
  .modal{
    background:var(--cream-50); width:100%; max-width:480px; border-radius:22px 22px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  .modal h2{font-size:17px; font-weight:800; margin:0 0 16px; color:var(--forest-900);}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-600); margin-bottom:5px;}
  .field-row{display:flex; gap:8px;}
  .field-row .field{flex:1;}
  .field input{
    width:100%; border:1.5px solid var(--wood-300); background:#fff; border-radius:11px;
    padding:11px 13px; font-size:15px; color:var(--ink-900);
  }
  .field input:focus{outline:none;border-color:var(--ember-500);}
  .scan-fill-btn{
    background:var(--forest-700); color:#fff; border:none; border-radius:11px;
    padding:0 14px; font-size:12px; font-weight:700; white-space:nowrap;
  }
  .modal-actions{display:flex; gap:8px; margin-top:18px;}
  .btn-primary{
    flex:1; background:var(--ember-500); color:var(--forest-900); border:none;
    border-radius:12px; padding:13px; font-weight:800; font-size:14.5px;
  }
  .btn-danger{
    background:transparent; color:var(--red-500); border:1.5px solid var(--red-500);
    border-radius:12px; padding:13px 16px; font-weight:700; font-size:13.5px;
  }
  .btn-ghost{
    background:transparent; color:var(--ink-600); border:none; font-size:13px;
    font-weight:600; padding:10px; width:100%; text-align:center; margin-top:4px;
  }
  .mini-cam{
    display:none; width:100%; aspect-ratio:1/1; border-radius:14px; overflow:hidden;
    margin-bottom:10px; background:var(--forest-900);
  }
  .mini-cam.active{display:block;}
  .mini-cam video{object-fit:cover;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--forest-900); color:#fff; padding:11px 20px; border-radius:30px;
    font-size:13px; font-weight:600; box-shadow:var(--shadow);
    opacity:0; transition:all .25s ease; z-index:200; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="mark">⛺</span>
      <div>
        <h1>원탑캠핑장</h1>
        <div class="sub">Barcode Price Check</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-view="scan">스캔</button>
      <button class="tab-btn" data-view="manage">물품 관리</button>
    </div>
  </header>

  <main>
    <!-- SCAN VIEW -->
    <section class="view active" id="view-scan">
      <div class="scan-frame" id="scanFrame">
        <div id="reader"></div>
        <div class="corners"><span></span><span></span><span></span><span></span></div>
        <div class="scan-status" id="scanStatus">카메라를 준비하고 있어요…</div>
      </div>

      <button class="capture-btn" id="captureBtn">📷 카메라로 촬영해서 인식</button>
      <input type="file" id="nativeCamInput" accept="image/*" capture="environment" style="display:none">

      <div class="result-card" id="resultCard">
        <div class="result-empty">바코드를 스캔하면<br>여기에 가격이 표시돼요</div>
      </div>

      <div class="manual-row">
        <input type="text" id="manualBarcode" inputmode="numeric" placeholder="바코드 직접 입력">
        <button id="manualLookupBtn">조회</button>
      </div>
    </section>

    <!-- MANAGE VIEW -->
    <section class="view" id="view-manage">
      <div class="search-add">
        <input type="text" id="searchInput" placeholder="상품명 또는 바코드 검색">
        <button class="add-btn" id="openAddBtn">＋</button>
      </div>
      <div class="item-count" id="itemCount"></div>
      <div id="itemList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="big">📦</div>
        <p>등록된 물품이 없어요<br>오른쪽 위 ＋ 버튼으로 첫 물품을 추가해보세요</p>
      </div>
    </section>
  </main>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">새 물품 추가</h2>

    <input type="file" id="miniNativeCamInput" accept="image/*" capture="environment" style="display:none">

    <div class="field">
      <label>바코드</label>
      <div class="field-row">
        <input type="text" id="fBarcode" inputmode="numeric" placeholder="숫자 입력 또는 카메라로 스캔">
        <button class="scan-fill-btn" id="scanFillBtn">📷 촬영해서 인식</button>
      </div>
    </div>
    <div class="field">
      <label>상품명</label>
      <input type="text" id="fName" placeholder="예: 컵라면, 장작 1단, 얼음">
    </div>
    <div class="field-row">
      <div class="field">
        <label>가격 (원)</label>
        <input type="text" id="fPrice" inputmode="numeric" placeholder="0">
      </div>
      <div class="field">
        <label>분류 (선택)</label>
        <input type="text" id="fCategory" placeholder="예: 식품, 용품">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn" style="display:none;">삭제</button>
      <button class="btn-primary" id="saveBtn">저장</button>
    </div>
    <button class="btn-ghost" id="closeModalBtn">취소</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'camp-items-v1';
let items = [];
let editingId = null;

// ---------- Storage (localStorage - works once deployed on https, no server needed) ----------
function loadItems(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    items = raw ? JSON.parse(raw) : [];
  }catch(e){
    items = [];
  }
  renderList();
}
function saveItems(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }catch(e){
    showToast('저장 중 오류가 발생했어요');
  }
}

function fmtWon(n){
  const num = Number(n) || 0;
  return num.toLocaleString('ko-KR');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=> t.classList.remove('show'), 1800);
}

// ---------- Tabs ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if(btn.dataset.view === 'scan'){ startScanner(); } else { stopScanner(); }
  });
});

// ---------- Main Scanner ----------
let html5QrCode = null;
let scannerRunning = false;
let lastScan = {code:null, time:0};

function startScanner(){
  if(scannerRunning) return;
  const statusEl = document.getElementById('scanStatus');
  statusEl.textContent = '카메라를 준비하고 있어요…';
  html5QrCode = new Html5Qrcode("reader", { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.QR_CODE
  ], verbose:false });

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 15,
      qrbox: { width: 280, height: 140 }, // 1D 바코드(EAN-13 등)는 가로로 길어서 넓게 잡아야 인식이 잘 됨
      aspectRatio: 1.0,
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: "continuous" }]
      },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true } // 지원 브라우저는 네이티브 바코드 인식 사용 (훨씬 정확)
    },
    (decodedText)=> onScanSuccess(decodedText),
    ()=>{ /* per-frame no-match, ignore */ }
  ).then(()=>{
    scannerRunning = true;
    statusEl.textContent = '바코드를 사각형 안에 가로로 맞춰주세요';
  }).catch(()=>{
    document.getElementById('reader').innerHTML =
      '<div class="cam-off">📷<br>카메라를 사용할 수 없어요<br><span style="font-size:11px;">권한을 허용했는지 확인해주세요</span>'+
      '<button id="retryCam">다시 시도</button></div>';
    document.getElementById('retryCam').addEventListener('click', startScanner);
  });
}
function stopScanner(){
  if(html5QrCode && scannerRunning){
    html5QrCode.stop().catch(()=>{});
    scannerRunning = false;
  }
}
// ---------- Decode a File (from native camera app) using html5-qrcode's file scanner ----------
async function decodeImageFile(file, onSuccess, onFail){
  const tempId = 'temp-scan-' + Date.now();
  const tempDiv = document.createElement('div');
  tempDiv.id = tempId;
  tempDiv.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;';
  document.body.appendChild(tempDiv);
  const tempScanner = new Html5Qrcode(tempId, { formatsToSupport: [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.QR_CODE
  ], verbose:false });
  try{
    const decoded = await tempScanner.scanFile(file, false);
    onSuccess(decoded);
  }catch(e){
    onFail('바코드를 찾지 못했어요. 바코드가 화면에 꽉 차게, 정면으로 다시 찍어주세요');
  }finally{
    try{ await tempScanner.clear(); }catch(e){}
    tempDiv.remove();
  }
}

// captureBtn now opens the phone's real camera app (via file input capture) instead of grabbing
// a frame from the low-quality live preview stream — this uses the phone's own autofocus/quality.
document.getElementById('captureBtn').addEventListener('click', function(){
  document.getElementById('nativeCamInput').click();
});
document.getElementById('nativeCamInput').addEventListener('change', function(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const btn = document.getElementById('captureBtn');
  btn.classList.add('loading');
  btn.textContent = '인식하는 중…';
  decodeImageFile(file, (code)=>{
    btn.classList.remove('loading');
    btn.textContent = '📷 카메라로 촬영해서 인식';
    if(navigator.vibrate) navigator.vibrate(60);
    lookupAndShow(code);
  }, (msg)=>{
    btn.classList.remove('loading');
    btn.textContent = '📷 카메라로 촬영해서 인식';
    showToast(msg);
  });
});

function onScanSuccess(code){
  const now = Date.now();
  if(code === lastScan.code && now - lastScan.time < 2200) return; // debounce dup
  lastScan = {code, time: now};
  if(navigator.vibrate) navigator.vibrate(60);
  lookupAndShow(code);
}

function lookupAndShow(code){
  const item = items.find(it => it.barcode === code.trim());
  const card = document.getElementById('resultCard');
  if(item){
    card.innerHTML = `
      <div class="result-name">${escapeHtml(item.name)}</div>
      <div class="result-price">${fmtWon(item.price)}<span class="won">원</span></div>
      <div class="result-meta">${escapeHtml(item.category || '')}${item.category ? ' · ' : ''}${escapeHtml(item.barcode)}</div>
    `;
  } else {
    card.innerHTML = `
      <div class="result-notfound">등록되지 않은 바코드예요</div>
      <div class="result-meta" style="margin-top:8px;">${escapeHtml(code)}</div>
      <button class="btn-primary" style="margin-top:14px;" id="quickAddBtn">이 바코드로 물품 추가</button>
    `;
    document.getElementById('quickAddBtn').addEventListener('click', ()=>{
      openModal(null, code);
    });
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('manualLookupBtn').addEventListener('click', ()=>{
  const v = document.getElementById('manualBarcode').value.trim();
  if(!v){ showToast('바코드를 입력해주세요'); return; }
  lookupAndShow(v);
});
document.getElementById('manualBarcode').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('manualLookupBtn').click();
});

// ---------- Manage: list rendering ----------
function renderList(){
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
  const filtered = items
    .filter(it => !q || it.name.toLowerCase().includes(q) || it.barcode.includes(q))
    .sort((a,b)=> a.name.localeCompare(b.name, 'ko'));

  const list = document.getElementById('itemList');
  const empty = document.getElementById('emptyState');
  document.getElementById('itemCount').textContent = items.length ? `총 ${items.length}개 물품` : '';

  if(items.length === 0){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty-state"><p>검색 결과가 없어요</p></div>';
    return;
  }

  list.innerHTML = filtered.map(it => `
    <div class="item-row" data-id="${it.id}">
      <div class="info">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="barcode">${escapeHtml(it.barcode)}</div>
        ${it.category ? `<span class="cat">${escapeHtml(it.category)}</span>` : ''}
      </div>
      <div class="price">${fmtWon(it.price)}원</div>
      <button class="edit-btn" data-edit="${it.id}">✎</button>
    </div>
  `).join('');

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = items.find(i => i.id === btn.dataset.edit);
      if(item) openModal(item);
    });
  });
}
document.getElementById('searchInput').addEventListener('input', renderList);

// ---------- Modal (add/edit) ----------
const modalBackdrop = document.getElementById('modalBackdrop');

function openModal(item, prefillBarcode){
  editingId = item ? item.id : null;
  document.getElementById('modalTitle').textContent = item ? '물품 수정' : '새 물품 추가';
  document.getElementById('fBarcode').value = item ? item.barcode : (prefillBarcode || '');
  document.getElementById('fName').value = item ? item.name : '';
  document.getElementById('fPrice').value = item ? item.price : '';
  document.getElementById('fCategory').value = item ? (item.category || '') : '';
  document.getElementById('deleteBtn').style.display = item ? 'block' : 'none';
  modalBackdrop.classList.add('active');
}
function closeModal(){
  modalBackdrop.classList.remove('active');
}
document.getElementById('openAddBtn').addEventListener('click', ()=> openModal(null));
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', (e)=>{ if(e.target === modalBackdrop) closeModal(); });

document.getElementById('saveBtn').addEventListener('click', ()=>{
  const barcode = document.getElementById('fBarcode').value.trim();
  const name = document.getElementById('fName').value.trim();
  const price = document.getElementById('fPrice').value.replace(/[^\d]/g,'');
  const category = document.getElementById('fCategory').value.trim();

  if(!barcode){ showToast('바코드를 입력해주세요'); return; }
  if(!name){ showToast('상품명을 입력해주세요'); return; }
  if(!price){ showToast('가격을 입력해주세요'); return; }

  const dup = items.find(it => it.barcode === barcode && it.id !== editingId);
  if(dup){ showToast('이미 등록된 바코드예요: ' + dup.name); return; }

  if(editingId){
    const it = items.find(i => i.id === editingId);
    it.barcode = barcode; it.name = name; it.price = Number(price); it.category = category;
  } else {
    items.push({ id: 'it_' + Date.now(), barcode, name, price: Number(price), category });
  }
  saveItems();
  renderList();
  closeModal();
  showToast('저장했어요');
});

document.getElementById('deleteBtn').addEventListener('click', ()=>{
  if(!editingId) return;
  items = items.filter(i => i.id !== editingId);
  saveItems();
  renderList();
  closeModal();
  showToast('삭제했어요');
});

// ---------- Scan-fill (opens the phone's real camera app, then decodes the photo) ----------
document.getElementById('scanFillBtn').addEventListener('click', ()=>{
  document.getElementById('miniNativeCamInput').click();
});
document.getElementById('miniNativeCamInput').addEventListener('change', function(e){
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const btn = document.getElementById('scanFillBtn');
  const originalLabel = btn.textContent;
  btn.textContent = '인식하는 중…';
  decodeImageFile(file, (code)=>{
    document.getElementById('fBarcode').value = code;
    if(navigator.vibrate) navigator.vibrate(60);
    btn.textContent = originalLabel;
    showToast('바코드를 인식했어요');
  }, (msg)=>{
    btn.textContent = originalLabel;
    showToast(msg);
  });
});

// ---------- Init ----------
loadItems();
startScanner();
</script>
</body>
